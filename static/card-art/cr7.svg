<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Bonus card CR7: a footballer seen from behind in the famous landing pose. Drawn by us, no photo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1A3A"/>
      <stop offset="0.68" stop-color="#1D3B6B"/>
      <stop offset="0.68" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="140" fill="url(#sky)"/>
  <rect width="100" height="140" fill="url(#light)"/>
  <g fill="#FFF6D8" opacity="0.8">
    <circle cx="14" cy="14" r="1"/><circle cx="84" cy="20" r="1.2"/><circle cx="72" cy="9" r="0.8"/>
    <circle cx="26" cy="30" r="0.8"/><circle cx="90" cy="44" r="0.9"/><circle cx="8" cy="50" r="0.9"/>
  </g>
  <ellipse cx="50" cy="126" rx="26" ry="4" fill="#000" opacity="0.3"/>
  <!-- legs apart, landing -->
  <g stroke-linecap="round">
    <line x1="43" y1="92" x2="33" y2="121" stroke="#C68A5E" stroke-width="7"/>
    <line x1="57" y1="92" x2="67" y2="121" stroke="#C68A5E" stroke-width="7"/>
    <line x1="35.5" y1="112" x2="32" y2="122" stroke="#DA291C" stroke-width="8"/>
    <line x1="64.5" y1="112" x2="68" y2="122" stroke="#DA291C" stroke-width="8"/>
    <!-- arms spread down and out -->
    <line x1="35" y1="45" x2="15" y2="72" stroke="#C68A5E" stroke-width="6"/>
    <line x1="65" y1="45" x2="85" y2="72" stroke="#C68A5E" stroke-width="6"/>
    <line x1="35" y1="45" x2="28" y2="55" stroke="#DA291C" stroke-width="8"/>
    <line x1="65" y1="45" x2="72" y2="55" stroke="#DA291C" stroke-width="8"/>
  </g>
  <path d="M33 80 H67 L69 95 H31 Z" fill="#046A38"/>
  <path d="M35 41 Q50 37 65 41 L68 82 H32 Z" fill="#DA291C"/>
  <rect x="45" y="32" width="10" height="8" rx="3" fill="#B97A50"/>
  <circle cx="50" cy="26" r="9.5" fill="#2A1A10"/>
  <text x="50" y="72" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#FFF6D8">7</text>
</svg>
